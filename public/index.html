<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kay • Minecraft Live Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #060911; color: #f1f5f9; font-family: ui-sans-serif, system-ui, sans-serif; }
    .mc-font { font-family: monospace, monospace; }
    iframe { border: none; width: 100%; height: 100%; }
  </style>
</head>
<body class="h-screen flex flex-col p-2 select-none overflow-hidden">

  <header class="flex justify-between items-center mb-2 bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 shadow">
    <div class="flex items-center gap-3">
      <div id="statusDot" class="w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse"></div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm md:text-base text-emerald-400 mc-font">KAY • LIVE STREAM</h1>
          <span class="bg-indigo-500/20 text-indigo-300 text-[10px] font-mono px-1.5 py-0.5 rounded border border-indigo-400/30">X11 + 3D VIEWER</span>
        </div>
        <p id="serverAddress" class="text-xs text-slate-400">141.95.47.55:10140</p>
      </div>
    </div>

    <!-- Переключатель режима трансляции -->
    <div class="flex items-center gap-2">
      <div class="bg-slate-950 p-1 rounded-lg border border-slate-800 flex gap-1">
        <button id="btnTabVnc" class="px-2.5 py-1 text-xs rounded font-semibold bg-emerald-600 text-white transition">
          🖥️ Видеоэкран (noVNC)
        </button>
        <button id="btnTabViewer" class="px-2.5 py-1 text-xs rounded font-semibold text-slate-400 hover:text-white transition">
          🌍 3D Viewer
        </button>
      </div>
      <button id="btnCreative" class="px-2.5 py-1.5 text-xs bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-semibold transition">
        🌟 Креатив
      </button>
      <button id="btnReconnect" class="px-2.5 py-1.5 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-700 transition">
        🔄 Перезайти
      </button>
    </div>
  </header>

  <div class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-2 overflow-hidden">
    
    <!-- Видеопоток экрана и управление -->
    <div class="lg:col-span-2 flex flex-col gap-2">
      <div class="relative flex-1 bg-black border-2 border-slate-800 rounded-xl overflow-hidden shadow-2xl flex flex-col">
        
        <!-- F3 / Статистика в верхнем углу -->
        <div class="absolute top-2 left-2 z-20 bg-black/70 backdrop-blur px-2.5 py-1 rounded text-[11px] font-mono text-emerald-300 pointer-events-none flex gap-2">
          <span id="coordText">XYZ: 0.0 / 0.0 / 0.0</span>
          <span>•</span>
          <span id="statHP">❤️ 20</span>
          <span id="statMode">GM: CREATIVE</span>
        </div>

        <!-- iframe для noVNC (видео-экран X11) -->
        <iframe id="frameVnc" src="/novnc/vnc.html?autoconnect=true&resize=scale&quality=6"></iframe>

        <!-- iframe для Prismarine-Viewer (альтернативный прямой 3D-рендер) -->
        <iframe id="frameViewer" src="/viewer/" class="hidden"></iframe>
      </div>

      <!-- Кнопки управления под экраном -->
      <div class="grid grid-cols-5 gap-1.5 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800">
        <button id="btnW" class="py-2 bg-slate-800 active:bg-emerald-600 rounded-lg text-xs font-bold transition">W (Вперёд)</button>
        <button id="btnA" class="py-2 bg-slate-800 active:bg-emerald-600 rounded-lg text-xs font-bold transition">A (Влево)</button>
        <button id="btnS" class="py-2 bg-slate-800 active:bg-emerald-600 rounded-lg text-xs font-bold transition">S (Назад)</button>
        <button id="btnD" class="py-2 bg-slate-800 active:bg-emerald-600 rounded-lg text-xs font-bold transition">D (Вправо)</button>
        <button id="btnSpace" class="py-2 bg-slate-800 active:bg-emerald-600 rounded-lg text-xs font-bold transition">Прыжок</button>
      </div>
    </div>

    <!-- Консоль, чат и команды -->
    <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg">
      <div class="p-2.5 bg-slate-800/80 border-b border-slate-800 font-semibold text-xs text-slate-300 flex justify-between items-center">
        <span>КОНСОЛЬ И ЧАТ</span>
        <span class="text-[10px] text-emerald-400">● ОНЛАЙН ТРАНСЛЯЦИЯ</span>
      </div>

      <div id="logBox" class="flex-1 p-2.5 overflow-y-auto font-mono text-xs space-y-1 text-slate-300 select-text bg-slate-950/60"></div>

      <div class="p-2 border-t border-slate-800 flex gap-1 overflow-x-auto text-xs bg-slate-900">
        <button class="quick-cmd px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 whitespace-nowrap" data-cmd="/gamemode creative">/creative</button>
        <button class="quick-cmd px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 whitespace-nowrap" data-cmd="/gamemode survival">/survival</button>
        <button class="quick-cmd px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 whitespace-nowrap" data-cmd="/time set day">/day</button>
        <button class="quick-cmd px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 whitespace-nowrap" data-cmd="/tp ~ ~ ~">/tp</button>
      </div>

      <form id="cmdForm" class="p-2 bg-slate-950 border-t border-slate-800 flex gap-2">
        <input 
          id="cmdInput" 
          type="text" 
          placeholder="Команда (/gamemode) или сообщение..." 
          class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 font-mono"
        />
        <button type="submit" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 rounded-lg text-xs font-semibold transition">
          Ввод
        </button>
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    const logBox = document.getElementById('logBox');
    const frameVnc = document.getElementById('frameVnc');
    const frameViewer = document.getElementById('frameViewer');
    const btnTabVnc = document.getElementById('btnTabVnc');
    const btnTabViewer = document.getElementById('btnTabViewer');

    btnTabVnc.addEventListener('click', () => {
      frameVnc.classList.remove('hidden');
      frameViewer.classList.add('hidden');
      btnTabVnc.className = 'px-2.5 py-1 text-xs rounded font-semibold bg-emerald-600 text-white transition';
      btnTabViewer.className = 'px-2.5 py-1 text-xs rounded font-semibold text-slate-400 hover:text-white transition';
    });

    btnTabViewer.addEventListener('click', () => {
      frameViewer.classList.remove('hidden');
      frameVnc.classList.add('hidden');
      btnTabViewer.className = 'px-2.5 py-1 text-xs rounded font-semibold bg-emerald-600 text-white transition';
      btnTabVnc.className = 'px-2.5 py-1 text-xs rounded font-semibold text-slate-400 hover:text-white transition';
    });

    socket.on('bot_state', (data) => {
      const dot = document.getElementById('statusDot');
      if (data.status === 'online') {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]';
      } else if (data.status === 'connecting') {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-amber-500 animate-ping';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-rose-500';
      }

      if (data.host) document.getElementById('serverAddress').innerText = data.host;
      if (data.position) {
        document.getElementById('coordText').innerText = `XYZ: ${data.position.x} / ${data.position.y} / ${data.position.z}`;
      }
      if (data.health) document.getElementById('statHP').innerText = `❤️ ${Math.round(data.health)}`;
      if (data.gameMode) document.getElementById('statMode').innerText = `GM: ${data.gameMode.toUpperCase()}`;
    });

    socket.on('log', (msg) => {
      const div = document.createElement('div');
      div.innerText = msg;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    });

    function bindBtn(id, key) {
      const el = document.getElementById(id);
      el.addEventListener('pointerdown', () => socket.emit('control_move', { key, active: true }));
      el.addEventListener('pointerup', () => socket.emit('control_move', { key, active: false }));
      el.addEventListener('pointerleave', () => socket.emit('control_move', { key, active: false }));
    }
    bindBtn('btnW', 'forward');
    bindBtn('btnS', 'back');
    bindBtn('btnA', 'left');
    bindBtn('btnD', 'right');
    bindBtn('btnSpace', 'jump');

    document.getElementById('btnCreative').addEventListener('click', () => socket.emit('set_creative'));
    document.getElementById('btnReconnect').addEventListener('click', () => socket.emit('reconnect_bot'));

    document.getElementById('cmdForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('cmdInput');
      if (input.value.trim()) {
        socket.emit('send_command', { text: input.value.trim() });
        input.value = '';
      }
    });

    document.querySelectorAll('.quick-cmd').forEach(btn => {
      btn.addEventListener('click', () => {
        socket.emit('send_command', { text: btn.dataset.cmd });
      });
    });
  </script>
</body>
</html>
